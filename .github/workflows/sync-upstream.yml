name: Sync upstream release

# This fork tracks upstream *releases*, never upstream/dev: a moving tip means
# chasing half-finished migrations, a release is a tested unit. The fork's own
# commits are rebased on top of the release, so `dev` is always
# "<upstream release> + our commits" and fork releases are cut from that.
#
# Because a rebase rewrites history, `dev` is force-pushed. The bot only ever
# does that after the required checks are green on the rebased result, and only
# if `dev` still points at the commit the rebase was built from — pushing your
# own work to `dev` first always wins and simply makes the bot's branch stale
# (it gets rebuilt on the next run).

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Upstream release tag to move to (default: latest stable)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  SYNC_BRANCH: sync-upstream-release

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # A rebased sync from an earlier run waits here until every required
      # check has reported success on its head commit; then it becomes `dev`.
      - name: Land the pending sync if its checks are green
        id: land
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          required_checks=("fork-footprint" "migration-drift" \
            "playwright-test-runner (@login)" "playwright-test-runner (@reader-view)")

          prnum=$(gh pr list --repo "$repo" --base dev --head "$SYNC_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$prnum" ]; then
            echo "No pending sync PR"
            exit 0
          fi

          body=$(gh pr view "$prnum" --repo "$repo" --json body --jq .body)
          dev_base=$(sed -n 's/.*<!-- dev-base: \([0-9a-f]\{40\}\) -->.*/\1/p' <<<"$body" | head -n1)
          dev_now=$(git rev-parse HEAD)
          if [ "$dev_base" != "$dev_now" ]; then
            echo "PR #$prnum was built on $dev_base but dev is now $dev_now; it will be rebuilt"
            exit 0
          fi

          head_sha=$(gh pr view "$prnum" --repo "$repo" --json headRefOid --jq .headRefOid)
          json=$(gh api "repos/$repo/commits/$head_sha/check-runs?per_page=100")
          all_green=yes
          any_failed=no
          for c in "${required_checks[@]}"; do
            concl=$(jq -r --arg n "$c" \
              '[.check_runs[] | select(.name==$n)] | sort_by(.completed_at // "") | last | .conclusion // "pending"' \
              <<<"$json")
            echo "check '$c': $concl"
            case "$concl" in
              success) ;;
              failure|cancelled|timed_out|action_required) all_green=no; any_failed=yes ;;
              *) all_green=no ;;
            esac
          done

          if [ "$all_green" != yes ]; then
            if [ "$any_failed" = yes ]; then
              echo "Checks failed on PR #$prnum; leaving it open for manual review"
            else
              echo "Checks still pending on PR #$prnum; re-evaluating on the next run"
            fi
            exit 0
          fi

          # --force-with-lease pins the expected current dev, so a push that
          # raced with this run makes the update fail instead of clobbering it.
          echo "All required checks green; moving dev to the rebased history"
          git fetch --quiet origin "$SYNC_BRANCH"
          git push --force-with-lease=dev:"$dev_base" \
            origin "$head_sha:refs/heads/dev"
          gh pr close "$prnum" --repo "$repo" --delete-branch \
            --comment "Landed on \`dev\` (force-push of the rebased history)." || true
          echo "landed=true" >> "$GITHUB_OUTPUT"

      - name: Release the landed sync
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref dev

      - name: Work out which upstream release we should be on
        id: plan
        if: steps.land.outputs.landed != 'true'
        run: |
          bash scripts/upstream-release.sh | tee -a "$GITHUB_OUTPUT"
          echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          # The dev commit the rebase is built from; the bot only lands its
          # result while dev still points here.
          echo "dev_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebase the fork onto the new upstream release
        id: rebase
        if: >-
          steps.land.outputs.landed != 'true' &&
          (steps.plan.outputs.behind == 'true' || inputs.target != '')
        run: |
          git checkout -B "$SYNC_BRANCH"
          set +e
          bash scripts/sync-upstream-rebase.sh ${{ steps.plan.outputs.target }} 2>&1 | tee /tmp/rebase.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ]

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the checks
      # this sync is gated on are dispatched explicitly. A later run of this
      # workflow reads their results and lands the branch.
      - name: Publish the rebased branch and dispatch its checks
        if: steps.rebase.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          target="${{ steps.plan.outputs.target }}"
          [ -n "$target" ] || target="${{ steps.plan.outputs.latest }}"
          dev_base="${{ steps.plan.outputs.dev_sha }}"

          git push -f origin "HEAD:refs/heads/$SYNC_BRANCH"

          body="Automated rebase of the fork's commits onto upstream \`$target\`."
          body+=$'\n\n'
          body+="Conflicts were replayed from the recorded rerere cache (\`.rr-cache/\`, see CLAUDE.md)."
          body+=$'\n'
          body+="Once every required check is green here, the sync workflow force-pushes this history to \`dev\` and cuts a release. Closing this PR, or pushing your own work to \`dev\`, is always safe — the bot rebuilds from whatever \`dev\` is then."
          body+=$'\n\n'
          body+="<!-- dev-base: $dev_base -->"

          prnum=$(gh pr list --repo "$repo" --base dev --head "$SYNC_BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$prnum" ]; then
            prnum=$(gh api "repos/$repo/pulls" \
              -f title="Sync fork onto upstream $target" \
              -f body="$body" \
              -f head="$SYNC_BRANCH" \
              -f base="dev" \
              --jq '.number')
          else
            gh pr edit "$prnum" --repo "$repo" \
              --title "Sync fork onto upstream $target" --body "$body"
          fi

          for wf in fork-footprint.yml migration-drift.yml playwright-tests.yml; do
            gh workflow run "$wf" --repo "$repo" --ref "$SYNC_BRANCH" \
              || echo "warning: could not dispatch $wf"
          done
          echo "Rebase published as PR #$prnum; it lands on a later run once checks pass."

      - name: Report conflicts that need a human
        if: steps.rebase.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          target="${{ steps.plan.outputs.target }}"
          [ -n "$target" ] || target="${{ steps.plan.outputs.latest }}"
          files=$(grep '^UNRESOLVED: ' /tmp/rebase.log | sed 's/^UNRESOLVED: /- /' || true)
          title="Upstream sync to $target needs manual conflict resolution"
          body=$(printf 'Rebasing the fork onto upstream `%s` hit conflicts that rerere has never seen:\n\n%s\n\nResolve it once locally and the bot takes over from there:\n\n```\ngit checkout dev\nbash scripts/sync-upstream-rebase.sh %s   # stops on the conflict\n# resolve, git add, git rebase --continue\nbash scripts/rerere-cache.sh save        # make the resolution committable\ngit add .rr-cache .github/upstream-release && git commit\ngit push --force-with-lease origin dev\n```\n' "$target" "$files" "$target")

          existing=$(gh issue list --repo "$repo" --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$repo" --title "$title" --body "$body"
          else
            echo "Issue #$existing already tracks this sync"
          fi
